name: Update profile README

on:
  workflow_dispatch:
  schedule:
    # Runs daily at 15:17 UTC. GitHub schedules use UTC.
    - cron: "17 15 * * *"
  push:
    paths:
      - "README.md"
      - "update_posts.py"
      - ".github/workflows/update-readme.yml"

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Update recent posts
        env:
          FEED_URL: "https://noahrflynn.com/feed.xml"
          POST_LIMIT: "8"
        run: python update_posts.py

      - name: Commit README if changed
        run: |
          if git diff --quiet README.md; then
            echo "No README changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Update recent posts"
          git push

